<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prompt Admin</title>
<style>
:root{--bg:#F8F7F4;--panel:#fff;--ink:#191919;--muted:#6b6963;--line:#e4e1da;--accent:#FF5A4E;--accent-ink:#fff;--ok:#1d7a46;--warn:#9a6700;--bad:#c0281d;--soft:#f0eee9;--radius:12px;--shadow:0 1px 2px rgba(25,25,25,.06),0 8px 24px rgba(25,25,25,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--panel:#1d1d1d;--ink:#f3f1ec;--muted:#a19e96;--line:#2d2d2d;--soft:#262626;--ok:#4cc27f;--warn:#e0a93b;--bad:#ff7a6f;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;padding:0 8px 18px}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:inline-block}
.brand small{display:block;font-weight:500;color:var(--muted);letter-spacing:0;font-size:12px}
.nav button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:550}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button[aria-current=page]{background:var(--ink);color:var(--bg)}
.nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{font-size:12px;border-radius:99px;padding:1px 8px;background:var(--soft);color:var(--muted)}
[aria-current=page] .pill{background:rgba(255,255,255,.18);color:inherit}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px}
main{padding:28px clamp(16px,3vw,40px) 80px;min-width:0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 4px}
.sub{color:var(--muted);margin:2px 0 0}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.95)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stat{padding:14px 16px}
.stat b{font-size:26px;display:block;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.toolbar input{flex:1;min-width:200px}
.table{width:100%;border-collapse:separate;border-spacing:0}
.table th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
.table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr:hover{background:var(--soft)}
.thumb{width:48px;height:60px;border-radius:8px;object-fit:cover;background:var(--soft);display:block;border:1px solid var(--line)}
.thumb.empty{display:grid;place-items:center;font-size:10px;color:var(--muted);text-align:center;line-height:1.1}
.title{font-weight:650}
.meta{color:var(--muted);font-size:13px}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;margin-right:4px;background:var(--soft);color:var(--muted)}
.badge.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.badge.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.actions{display:flex;gap:6px;justify-content:flex-end}
.empty-state{padding:56px 20px;text-align:center;color:var(--muted)}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.sections{display:grid;gap:16px}
.card.pad{padding:20px}
.card header{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.field{display:grid;gap:5px;margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field>label,.legend{font-weight:600;font-size:14px}
.hint{color:var(--muted);font-size:12.5px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.count.bad{color:var(--bad)}
.count.ok{color:var(--ok)}
.input,textarea.input,select.input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
textarea.input{min-height:92px;resize:vertical;line-height:1.5}
textarea.mono{font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:190px}
.input.invalid{border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.chips input{border:0;background:transparent;outline:0;min-width:120px;flex:1;padding:4px 6px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--soft);border-radius:99px;padding:2px 4px 2px 10px;font-size:13px}
.chip button{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;text-align:center;line-height:18px;color:var(--muted)}
.chip button:hover{background:var(--line);color:var(--ink)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;inset:0;cursor:pointer}
.choice span{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--bg);font-size:13.5px;font-weight:550}
.choice input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.choice input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;cursor:pointer;background:var(--bg);color:var(--muted);transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--ink)}
.drop img{max-height:340px;max-width:100%;border-radius:10px;display:block;margin:0 auto 10px}
.drop b{color:var(--ink)}
.notice{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--panel);border-radius:9px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.notice.bad{border-left-color:var(--bad)}
.notice.ok{border-left-color:var(--ok)}
.notice ul{margin:6px 0 0;padding-left:18px}
.side-col{position:sticky;top:20px;display:grid;gap:16px}
.preview img{width:100%;border-radius:10px;display:block;background:var(--soft)}
.preview .ph{aspect-ratio:4/5;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--muted);font-size:13px}
.preview h3{margin:12px 0 4px;font-size:16px;line-height:1.3}
.promptbox{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;max-height:150px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:8px 0 10px}
.check{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px}
.check li{display:flex;gap:8px;align-items:flex-start;color:var(--muted)}
.check li::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);margin-top:2px}
.check li.done{color:var(--ink)}
.check li.done::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--panel)}
.bar{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.savebar{position:sticky;bottom:0;margin:20px -4px 0;padding:12px 4px;display:flex;gap:10px;justify-content:flex-end;align-items:center;background:linear-gradient(to top,var(--bg) 70%,transparent);flex-wrap:wrap}
.log{background:#111;color:#e9e6df;border-radius:10px;padding:14px;font:12.5px/1.55 ui-monospace,Menlo,monospace;max-height:420px;overflow:auto;white-space:pre-wrap}
#toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:50}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:340px;font-weight:550;animation:in .2s}
.toast.bad{background:var(--bad);color:#fff}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:22px;max-width:420px;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog menu{display:flex;gap:8px;justify-content:flex-end;padding:0;margin:18px 0 0}
.sr{position:absolute;left:-9999px}
@media (max-width:1080px){.editor{grid-template-columns:1fr}.side-col{position:static}}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px}.brand{padding:0 8px 0 0}.side .foot{display:none}.nav{display:flex;gap:4px;flex-wrap:wrap}.nav button{width:auto}.grid2{grid-template-columns:1fr}.table .hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body.online [data-nav="drafts"],body.online #b-draft,body.online #bulk-draft{display:none}
.foot .linkbtn{margin-top:8px;display:inline-block}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i aria-hidden="true"></i><div><span id="brand">Prompt Admin</span><small>Content manager</small></div></div>
    <nav class="nav" aria-label="Admin">
      <button data-nav="library">Library <span class="pill" id="n-lib">0</span></button>
      <button data-nav="drafts">Drafts <span class="pill" id="n-draft">0</span></button>
      <button data-nav="editor">Add prompt</button>
      <button data-nav="bulk">Bulk upload</button>
      <button data-nav="guides">Guides</button>
      <button data-nav="build">Publish site</button>
    </nav>
    <div class="foot">Local tool. Changes write to <code>data/</code> and <code>images/</code> on this computer.</div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<dialog id="dlg"><h2 id="dlg-t"></h2><p id="dlg-b" class="sub"></p><menu><button class="btn" value="cancel">Cancel</button><button class="btn dark" value="ok" id="dlg-ok">OK</button></menu></dialog>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const SLUG = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
const RATIOS = ['1:1', '4:5', '3:4', '2:3', '9:16', '3:2', '4:3', '16:9'];
const TOOL_NAMES = { chatgpt: 'ChatGPT', gemini: 'Gemini', firefly: 'Adobe Firefly', midjourney: 'Midjourney', leonardo: 'Leonardo', copilot: 'Copilot' };
let meta, lib = { published: [], drafts: [] }, view = 'library', form = null, dirty = false, filters = { q: '', cat: '', sort: 'new' };

// ---------- tiny DOM helper (text is always set as text, never HTML)
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k in el && k !== 'list') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
function toast(msg, bad) {
  const t = h('div', { class: 'toast' + (bad ? ' bad' : '') }, msg);
  $('#toasts').append(t);
  setTimeout(() => t.remove(), bad ? 6000 : 2800);
}
function confirmDialog(title, body, okLabel = 'Confirm') {
  return new Promise((resolve) => {
    const d = $('#dlg');
    $('#dlg-t').textContent = title; $('#dlg-b').textContent = body; $('#dlg-ok').textContent = okLabel;
    d.addEventListener('close', () => resolve(d.returnValue === 'ok'), { once: true });
    d.querySelectorAll('button').forEach((b) => (b.onclick = () => d.close(b.value)));
    d.showModal();
  });
}
// Online mode: the same panel is served by the Cloudflare Worker at /admin and talks to /api/admin/*.
const ONLINE = location.pathname.replace(/\/+$/, '') === '/admin';
const API = ONLINE ? '/api/admin' : '/api';
if (ONLINE) document.body.classList.add('online');
async function api(path, opts = {}) {
  if (ONLINE) path = path.replace(/^\/api\//, '/api/admin/');
  const res = await fetch(path, { ...opts, headers: { 'X-Admin-Request': '1', 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  const type = res.headers.get('content-type') || '';
  const data = type.includes('json') ? await res.json() : await res.text();
  if (res.status === 401 && ONLINE && path !== '/api/admin/login') { location.reload(); }
  if (!res.ok) { const e = new Error('Request failed'); e.errors = data.errors || [String(data)]; throw e; }
  return data;
}
/** Online mode: uploads each image to the server first, so saving only sends small references. */
async function stageImages(items, onProgress) {
  if (!ONLINE) return items;
  let done = 0;
  const out = items.map((it) => ({ ...it }));
  const queue = out.filter((it) => it.imageData);
  const worker = async () => {
    for (let it; (it = queue.shift());) {
      const r = await api('/api/blob', { method: 'POST', body: JSON.stringify({ dataUrl: it.imageData }) });
      it.imageBlob = { sha: r.sha, ext: r.ext };
      delete it.imageData;
      onProgress?.(++done);
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  return out;
}
const slugify = (s) => s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 70);
const liveSlug = (s) => s.toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/-{2,}/g, '-').replace(/^-+/, '').slice(0, 70);
const catName = (slug) => meta.categories.find((c) => c.slug === slug)?.name || slug;
const blank = () => ({ id: '', slug: '', slugEdited: false, title: '', description: '', promptText: '', category: '', tags: [], style: '', uses: [], ratio: '4:5', imageAlt: '', supportedTools: [], tested: false, featured: false, visualNotes: '', seoTitle: '', seoDescription: '', customize: Object.fromEntries(meta.customizeKeys.map((k) => [k, ''])), imageData: '', existingImage: false, imageVersion: 0, mode: 'new' });

// ---------- navigation
async function refresh() {
  lib = await api('/api/library');
  $('#n-lib').textContent = lib.published.length;
  $('#n-draft').textContent = lib.drafts.length;
}
async function go(next, opts = {}) {
  if (dirty && ['editor', 'bulk', 'guide-edit'].includes(view) && next !== view && !opts.force) {
    if (!(await confirmDialog('Discard unsaved changes?', 'You have changes that are not saved yet.', 'Discard'))) return;
  }
  dirty = false;
  view = next;
  if (next === 'editor' && !opts.keep) form = blank();
  document.querySelectorAll('[data-nav]').forEach((b) => (b.dataset.nav === (view === 'guide-edit' ? 'guides' : view) ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')));
  await render();
  window.scrollTo(0, 0);
}
document.querySelectorAll('[data-nav]').forEach((b) => b.addEventListener('click', () => go(b.dataset.nav)));
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

async function render() {
  const main = $('#main');
  main.replaceChildren();
  if (view === 'library') main.append(libraryView(false));
  else if (view === 'drafts') main.append(libraryView(true));
  else if (view === 'editor') main.append(editorView());
  else if (view === 'bulk') main.append(bulkView());
  else if (view === 'guides') main.append(await guidesView());
  else if (view === 'guide-edit') main.append(guideEditor());
  else if (view === 'build') main.append(buildView());
}

// ---------- library
function libraryView(drafts) {
  const items = drafts ? lib.drafts : lib.published;
  const q = filters.q.toLowerCase();
  let rows = items.filter((p) => (!filters.cat || p.category === filters.cat) && (!q || [p.title, p.slug, p.promptText, (p.tags || []).join(' ')].join(' ').toLowerCase().includes(q)));
  rows.sort((a, b) => filters.sort === 'az' ? (a.title || '').localeCompare(b.title || '') : (b.publishedAt || '').localeCompare(a.publishedAt || '') || (b.id || '').localeCompare(a.id || ''));
  const noImg = lib.published.filter((p) => !p.hasImage).length;
  const root = h('div');
  root.append(h('div', { class: 'top' },
    h('div', {}, h('h1', {}, drafts ? 'Drafts' : 'Prompt library'), h('p', { class: 'sub' }, drafts ? 'Unfinished prompts. Drafts are never built into the site.' : 'Every published prompt and its image.')),
    h('button', { class: 'btn primary', onclick: () => go('editor') }, '+ Add prompt')));
  if (!drafts) {
    root.append(h('div', { class: 'stats' },
      stat(lib.published.length, 'Published prompts'),
      stat(lib.published.length - noImg, 'With your image'),
      stat(noImg, 'Using demo artwork'),
      ONLINE ? null : stat(lib.drafts.length, 'Drafts')));
  }
  root.append(h('div', { class: 'toolbar' },
    h('input', { type: 'search', placeholder: 'Search title, prompt or tag', 'aria-label': 'Search', value: filters.q, oninput: (e) => { filters.q = e.target.value; const pos = e.target.selectionStart; render().then(() => { const i = $('.toolbar input'); i.focus(); i.setSelectionRange(pos, pos); }); } }),
    h('select', { 'aria-label': 'Category', onchange: (e) => { filters.cat = e.target.value; render(); } }, h('option', { value: '' }, 'All categories'), meta.categories.map((c) => h('option', { value: c.slug, selected: filters.cat === c.slug }, c.name))),
    h('select', { 'aria-label': 'Sort', onchange: (e) => { filters.sort = e.target.value; render(); } }, h('option', { value: 'new', selected: filters.sort === 'new' }, 'Newest first'), h('option', { value: 'az', selected: filters.sort === 'az' }, 'A to Z'))));
  const card = h('div', { class: 'card', style: 'overflow:auto' });
  if (!rows.length) {
    card.append(h('div', { class: 'empty-state' }, h('p', {}, items.length ? 'No prompts match your filters.' : drafts ? 'No drafts yet.' : 'No prompts yet.'), h('button', { class: 'btn primary', onclick: () => go('editor') }, 'Add your first prompt')));
  } else {
    card.append(h('table', { class: 'table' },
      h('thead', {}, h('tr', {}, h('th', {}, 'Image'), h('th', {}, 'Prompt'), h('th', { class: 'hide-sm' }, 'Category'), h('th', { class: 'hide-sm' }, 'Tools'), h('th', { class: 'hide-sm' }, 'Date'), h('th', {}, ''))),
      h('tbody', {}, rows.map((p) => row(p, drafts)))));
  }
  root.append(card);
  return root;
}
const stat = (n, label) => h('div', { class: 'stat' }, h('b', {}, String(n)), h('span', {}, label));
function thumb(p) {
  if (p._draft && p.imageData) return h('img', { class: 'thumb', src: p.imageData, alt: '' });
  if (p.hasImage) return h('img', { class: 'thumb', src: `${API}/image/${encodeURIComponent(p.slug)}?v=${p.imageVersion}`, alt: '', loading: 'lazy' });
  return h('div', { class: 'thumb empty' }, 'No image');
}
function row(p, draft) {
  return h('tr', {},
    h('td', {}, thumb(p)),
    h('td', {}, h('div', { class: 'title' }, p.title || '(untitled)'), h('div', { class: 'meta' }, '/' + (p.slug || '…') + '/ · ' + (p.ratio || '')), h('div', {}, draft ? h('span', { class: 'badge warn' }, 'Draft') : p.hasImage ? h('span', { class: 'badge ok' }, 'Your image') : h('span', { class: 'badge bad' }, 'Demo artwork'), p.tested ? h('span', { class: 'badge ok' }, 'Tested') : h('span', { class: 'badge' }, 'Untested'), p.featured ? h('span', { class: 'badge' }, 'Featured') : null)),
    h('td', { class: 'hide-sm' }, p.category ? catName(p.category) : '-'),
    h('td', { class: 'hide-sm meta' }, (p.supportedTools || []).map((t) => TOOL_NAMES[t] || t).join(', ') || '-'),
    h('td', { class: 'hide-sm meta' }, p.publishedAt || '-'),
    h('td', {}, h('div', { class: 'actions' },
      h('button', { class: 'btn sm', title: 'Copy prompt text', onclick: () => copy(p.promptText) }, 'Copy'),
      h('button', { class: 'btn sm', onclick: () => edit(p, draft) }, 'Edit'),
      h('button', { class: 'btn sm danger', onclick: () => remove(p, draft) }, 'Delete'))));
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text || ''); toast('Prompt copied'); }

    const body = { ...f, asDraft, mode: undefined, slugEdited: undefined, existingImage: undefined, imageVersion: undefined, _w: undefined, _h: undefined };

// ---------- shared image helpers
const natural = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
function readAsDataUrl(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
/** Reads an image file, shrinking very large files so 60+ uploads stay manageable. Returns { dataUrl, w, h, note }. */
async function prepareImage(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error(`${file.name}: use JPG, PNG or WebP`);
  const raw = await readAsDataUrl(file);
  const bmp = await createImageBitmap(file);
  const long = Math.max(bmp.width, bmp.height);
  if (file.size <= 4 * 1048576 && long <= 2600) { const out = { dataUrl: raw, w: bmp.width, h: bmp.height, note: '' }; bmp.close?.(); return out; }
  const scale = Math.min(1, 2400 / long);
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const w = c.width, h = c.height; bmp.close?.();
  let url = c.toDataURL('image/webp', 0.9);
  if (!url.startsWith('data:image/webp')) url = c.toDataURL('image/jpeg', 0.9);
  return { dataUrl: url, w, h, note: 'resized to fit' };
}
